<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; font-src 'self'; img-src data:; media-src data:" />
    <title>pokebuddy</title>
    <style>
      /* 글꼴 — Galmuri (SIL OFL 1.1, assets/fonts/OFL.txt). 도트 글꼴이라 정해진 크기에서만 선명하다.
         Galmuri11 은 12·24px, Galmuri14 는 15px, Galmuri9 는 10px 로만 쓴다 (docs/work/ui-pixel-style/record.md) */
      @font-face {
        font-family: "Galmuri11";
        src: url("../../assets/fonts/Galmuri11.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "Galmuri11";
        src: url("../../assets/fonts/Galmuri11-Bold.woff2") format("woff2");
        font-weight: 700;
      }
      @font-face {
        font-family: "Galmuri14";
        src: url("../../assets/fonts/Galmuri14.woff2") format("woff2");
      }
      @font-face {
        font-family: "Galmuri9";
        src: url("../../assets/fonts/Galmuri9.woff2") format("woff2");
      }
      :root {
        --font-body: "Galmuri11", "Malgun Gothic", sans-serif;
        --font-small: "Galmuri9", "Galmuri11", "Malgun Gothic", sans-serif;
        --font-large: "Galmuri14", "Galmuri11", "Malgun Gothic", sans-serif;
        /* 굵은 파일이 없는 Galmuri14·9 를 가짜로 굵게 만들면 도트가 뭉개진다 */
        font-synthesis: none;
      }
      /* 무대 — 투명 창 하나에 캔버스 하나. 창은 메인이 setBounds 로만 옮긴다.
         -webkit-app-region 은 두지 않는다 — OS 가 마우스를 가로채면 클릭·놓기를 렌더러가 알 수 없다 (옛 pointer.js 머리말) */
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        cursor: default;
      }
      canvas {
        display: block;
        image-rendering: pixelated; /* 도트 뭉개짐 방지 — 비트맵에 구워진 블러는 못 막으므로 stage.ts 가 imageSmoothing 도 끈다 */
      }
      /* ?debug=1 · stage:init.debug — 화면 안 텍스트로 상태를 본다 (콘솔 대신) */
      #debug {
        position: fixed;
        left: 4px;
        top: 4px;
        margin: 0;
        padding: 4px 6px;
        font: 11px/1.4 ui-monospace, Menlo, Consolas, monospace;
        color: #fff;
        background: rgba(0, 0, 0, 0.6);
        border-radius: 4px;
        white-space: pre;
        pointer-events: none;
      }
      #debug[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <pre id="debug" hidden></pre>
    <script type="module" src="../../dist/renderer/stage.js"></script>
  </body>
</html>
