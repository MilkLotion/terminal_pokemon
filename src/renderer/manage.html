<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:" />
    <title>pokebuddy</title>
    <style>
      /* 관리 창 — 값은 화면 스냅샷이 준다 (manage.ts). 색은 Figma `PB / Color` 변수와 같다 */
      :root {
        --canvas: #f1f2ee;
        --surface: #ffffff;
        --accent-bg: #ebf4f1;
        --subtle: #dde1db;
        --ink: #1a3330;
        --muted: #4a6663;
        --inverse: #ffffff;
        --disabled: #9ca3af;
        --line: #dde1db;
        --primary: #0f766e;
        --primary-hover: #0a5f56;
        --warning: #f59e0b;
        --danger: #dc2626;
        --scrim: rgba(26, 51, 48, 0.45);
        --radius: 12px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--canvas);
        color: var(--ink);
        font: 13px/1.5 "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* 헤더 — 브랜드, 보유 포인트, 업적창·설정 아이콘.
         제목 표시줄 자리를 이 헤더가 대신하므로 끌어서 창을 옮길 수 있어야 한다.
         오른쪽은 OS 가 그리는 창 조작 단추의 폭만큼 비운다. 겹쳐 두면 아이콘을 누를 수 없다 */
      header {
        flex: none;
        height: 61px;
        display: flex;
        align-items: center;
        gap: 12px;
        /* macOS 는 왼쪽에, Windows 는 오른쪽에 창 조작 단추가 앉는다. 양쪽 다 비워 둔다 */
        padding-left: calc(env(titlebar-area-x, 0px) + 24px);
        padding-right: calc(100vw - env(titlebar-area-width, 100vw) - env(titlebar-area-x, 0px) + 16px);
        background: var(--surface);
        border-bottom: 1px solid var(--line);
        -webkit-app-region: drag;
      }
      header button {
        -webkit-app-region: no-drag;
      }
      /* 헤더 아이콘 — 선으로만 그린다. 채움이 없어 글자와 같은 무게로 보인다 */
      .icon {
        position: relative;
        appearance: none;
        border: 0;
        background: none;
        padding: 6px;
        border-radius: 8px;
        color: var(--muted);
        cursor: pointer;
        display: flex;
      }
      .icon:hover {
        background: var(--accent-bg);
        color: var(--ink);
      }
      .icon svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      /* 미수령 보상 표시 — 테두리 강조 대신 점 하나 */
      .icon .dot {
        position: absolute;
        right: 4px;
        top: 4px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--primary);
      }
      .brand {
        font-size: 15px;
        font-weight: 600;
      }
      .spacer {
        flex: 1;
      }
      .points-label {
        color: var(--muted);
        font-size: 11px;
      }
      .points {
        font-size: 14px;
        font-weight: 600;
      }

      /* 탭 */
      nav {
        flex: none;
        display: flex;
        gap: 4px;
        padding: 0 24px;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }
      nav button {
        appearance: none;
        border: 0;
        background: none;
        color: var(--muted);
        font: inherit;
        padding: 8px 14px 6px;
        border-bottom: 2px solid transparent;
        cursor: pointer;
      }
      nav button[aria-selected="true"] {
        color: var(--primary);
        border-bottom-color: var(--primary);
        font-weight: 600;
      }

      /* 본문 — 여기만 스크롤한다 */
      main {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
      }
      .head {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 14px;
      }
      .head h1 {
        margin: 0;
        font-size: 20px;
      }
      .head .sub {
        color: var(--muted);
        font-size: 12px;
      }

      /* 파티 칸 */
      .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .slot {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 16px;
        min-height: 160px;
        display: flex;
        gap: 14px;
        text-align: left;
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      .slot.blank {
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 6px;
        color: var(--muted);
        background: none;
        border-style: dashed;
      }
      .slot.blank strong {
        color: var(--ink);
        font-size: 13px;
      }
      .slot.blank small {
        font-size: 11px;
      }
      .slot.locked {
        cursor: default;
        color: var(--disabled);
      }
      .portrait {
        position: relative;
        flex: none;
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: var(--accent-bg);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        color: var(--muted);
      }
      /* 숨김 마커 — 닫힌 몬스터볼. 그림 예외라 색을 변수에 묶지 않는다 */
      .mark {
        position: absolute;
        right: -2px;
        top: -2px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 1.5px solid var(--ink);
        background: linear-gradient(to bottom, #e35b4f 0 50%, #ffffff 50% 100%);
        overflow: hidden;
      }
      .mark::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        height: 1.5px;
        margin-top: -0.75px;
        background: var(--ink);
      }
      .mark::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 5px;
        height: 5px;
        margin: -2.5px 0 0 -2.5px;
        border-radius: 50%;
        background: #ffffff;
        border: 1.5px solid var(--ink);
      }
      .info {
        flex: 1;
        min-width: 0;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: var(--muted);
      }
      .name {
        font-size: 15px;
        font-weight: 600;
        margin: 2px 0 6px;
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-bottom: 8px;
      }
      .tag {
        font-size: 10px;
        padding: 2px 7px;
        border-radius: 999px;
        background: var(--subtle);
        color: var(--ink);
      }
      .tag.nature {
        background: none;
        color: var(--muted);
        padding-left: 0;
      }
      .meters {
        display: flex;
        gap: 10px;
      }
      .meter {
        flex: 1;
        min-width: 0;
      }
      .meter .row {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        color: var(--muted);
      }
      .track {
        height: 6px;
        border-radius: 3px;
        background: var(--subtle);
        overflow: hidden;
        margin-top: 3px;
      }
      .fill {
        height: 100%;
        background: var(--primary);
      }
      .fill.hungry {
        background: var(--warning);
      }
      .fill.starving {
        background: var(--danger);
      }

      /* 개체 상세 — 칸을 누르면 뜬다 */
      .scrim {
        position: fixed;
        inset: 0;
        background: var(--scrim);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .scrim.open {
        display: flex;
      }
      .dialog {
        width: 380px;
        max-height: 100%;
        overflow-y: auto;
        background: var(--surface);
        border-radius: var(--radius);
        padding: 20px;
      }
      .dialog h2 {
        margin: 0 0 4px;
        font-size: 17px;
      }
      .dialog .sub {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 14px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 16px;
      }
      button.act {
        appearance: none;
        font: inherit;
        padding: 7px 14px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink);
        cursor: pointer;
      }
      button.act.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: var(--inverse);
      }
      button.act.primary:hover:not(:disabled) {
        background: var(--primary-hover);
      }
      button.act:disabled {
        color: var(--disabled);
        cursor: default;
      }
      /* 주 버튼이 막히면 채움도 뺀다 — 누를 수 있는 버튼과 헷갈리지 않게 */
      button.act.primary:disabled {
        background: var(--subtle);
        border-color: var(--subtle);
      }
      /* 알림 — 할 말이 없으면 자리도 차지하지 않는다 */
      .notice {
        margin-top: 14px;
        padding: 10px 12px;
        border-radius: 8px;
        background: var(--accent-bg);
        font-size: 12px;
      }
      .notice:empty {
        display: none;
      }
      .notice.bad {
        background: #fdecec;
        color: var(--danger);
      }
      .empty-note {
        color: var(--muted);
        padding: 40px 0;
        text-align: center;
      }
      /* 곁들이는 한 줄 — 알·박스 칸에서 쓴다 */
      .note {
        color: var(--muted);
      }

      /* 분류 칩 — 도감·상점의 거르개 */
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 14px;
      }
      .chip {
        appearance: none;
        font: inherit;
        font-size: 12px;
        padding: 4px 11px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--muted);
        cursor: pointer;
      }
      .chip[aria-pressed="true"] {
        background: var(--primary);
        border-color: var(--primary);
        color: var(--inverse);
      }

      /* 목록 행 — 상점 상품과 가방 도구 */
      .rows {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      /* 대화상자 안의 목록은 한 줄에 하나 — 좁은 폭에서 반씩 나누면 글자가 잘린다 */
      #dialog .rows {
        grid-template-columns: 1fr;
      }
      .row-card {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--surface);
        text-align: left;
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      .row-card:disabled {
        color: var(--disabled);
        cursor: default;
      }
      /* 고른 행 — 왼쪽 막대와 옅은 배경. 테두리 색으로 강조하지 않는다 */
      .row-card[aria-pressed="true"] {
        position: relative;
        background: var(--accent-bg);
      }
      .row-card[aria-pressed="true"]::before {
        content: "";
        position: absolute;
        left: 0;
        top: 50%;
        transform: translateY(-50%);
        width: 3px;
        height: 20px;
        border-radius: 0 3px 3px 0;
        background: var(--primary);
      }
      /* 성격 변경 — 왼쪽 지금, 가운데 민트, 오른쪽 바꾼 후. 두 카드는 높이가 같다 (Figma Detail / Nature Change) */
      .compare {
        display: flex;
        align-items: stretch;
        gap: 12px;
        margin-top: 12px;
      }
      .nat-card {
        flex: 1;
        min-width: 0;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        font-size: 13px;
      }
      .nat-card .portrait {
        width: 56px;
        height: 56px;
      }
      .nat-card .name {
        font-weight: 600;
      }
      .nat-card .note,
      .mint-mid {
        font-size: 11px;
        color: var(--muted);
      }
      .mint-mid {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        text-align: center;
        max-width: 72px;
      }
      /* 셀렉트 — Figma Select. 열면 목록이 아래에 겹쳐 뜬다 */
      .select {
        position: relative;
      }
      .select-btn {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        font: inherit;
        font-size: 13px;
        color: inherit;
        cursor: pointer;
      }
      .select-btn[aria-expanded="true"] {
        border-color: var(--primary);
      }
      .select-btn .chev {
        font-size: 10px;
        color: var(--muted);
      }
      /* 목록이 열린 동안은 대화상자가 목록을 자르지 않는다 — 목록은 대화상자 밖으로 겹쳐 뜬다 */
      #dialog:has(.select-list) {
        overflow: visible;
      }
      .select-list {
        position: absolute;
        top: calc(100% + 4px);
        left: 50%;
        transform: translateX(-50%);
        z-index: 5;
        width: 184px;
        max-height: 220px;
        overflow-y: auto;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: 0 4px 12px rgba(26, 51, 48, 0.12);
      }
      .select-opt {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        width: 100%;
        padding: 8px 12px;
        border: none;
        border-radius: 4px;
        background: none;
        font: inherit;
        font-size: 13px;
        color: inherit;
        text-align: left;
        white-space: nowrap;
        cursor: pointer;
      }
      .select-opt .hint {
        font-size: 11px;
        color: var(--muted);
      }
      .select-opt:disabled,
      .select-opt:disabled .hint {
        color: var(--disabled);
        cursor: default;
      }
      .select-opt[aria-pressed="true"] {
        background: var(--accent-bg);
      }
      .select-opt[aria-pressed="true"]::before {
        content: "";
        position: absolute;
        left: 0;
        top: 50%;
        transform: translateY(-50%);
        width: 3px;
        height: 20px;
        border-radius: 0 3px 3px 0;
        background: var(--primary);
      }
      .info-box {
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--canvas);
        font-size: 13px;
      }
      .info-box .note {
        font-size: 11px;
        color: var(--muted);
        margin-top: 2px;
      }
      .row-card .body {
        flex: 1;
        min-width: 0;
      }
      .row-card .title {
        font-weight: 600;
        font-size: 13px;
      }
      .row-card .note {
        font-size: 11px;
        color: var(--muted);
      }
      .row-card .price {
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
      }
      .row-card .count {
        font-size: 13px;
        color: var(--muted);
        white-space: nowrap;
      }

      /* 돌보미집 */
      .daycare {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 14px 16px;
        margin-bottom: 16px;
      }
      .daycare .title {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 10px;
      }
      .daycare .title strong {
        font-size: 14px;
      }
      .daycare .title span {
        font-size: 11px;
        color: var(--muted);
      }
      .eggs {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .egg {
        width: 128px;
        padding: 10px;
        border-radius: 10px;
        border: 1px solid var(--line);
        text-align: center;
        font-size: 11px;
      }
      .egg .shell {
        width: 30px;
        height: 38px;
        margin: 0 auto 6px;
        border-radius: 50% 50% 46% 46%;
        background: var(--accent-bg);
        border: 1px solid var(--line);
      }
      .egg .acts {
        display: flex;
        gap: 4px;
        margin-top: 6px;
      }
      .egg .acts button {
        flex: 1;
        appearance: none;
        font: inherit;
        font-size: 10px;
        padding: 3px 0;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: var(--surface);
        cursor: pointer;
      }
      .egg .acts button:disabled {
        color: var(--disabled);
        cursor: default;
      }
      .egg .acts button.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: var(--inverse);
      }

      /* 박스 */
      .pager {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }
      .pager button {
        appearance: none;
        font: inherit;
        padding: 3px 10px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: var(--surface);
        cursor: pointer;
      }
      .pager button:disabled {
        color: var(--disabled);
        cursor: default;
      }
      .pager .label {
        font-weight: 600;
      }
      .pager .used {
        font-size: 11px;
        color: var(--muted);
      }
      .box-grid {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 6px;
      }
      .cell {
        appearance: none;
        font: inherit;
        aspect-ratio: 1 / 1;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--surface);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        font-size: 10px;
        cursor: pointer;
        padding: 2px;
      }
      .cell.blank {
        background: none;
        border-style: dashed;
        cursor: default;
      }
      .cell .dot {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--accent-bg);
      }
      .cell .who {
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* 도감 */
      .dex-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
      }
      .dex-cell {
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--surface);
        padding: 10px 6px;
        text-align: center;
        font-size: 11px;
      }
      .dex-cell.locked {
        background: var(--subtle);
        color: var(--muted);
      }
      .dex-cell .no {
        font-size: 10px;
        color: var(--muted);
      }
      .dex-cell .dot {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--accent-bg);
        margin: 4px auto;
      }

      /* ── 모달 ─────────────────────────────────────────────────────────────── */
      /* 넓은 모달 — 개체 고르기의 격자가 들어간다 */
      .dialog.wide {
        width: 560px;
      }
      /* 긴 모달 — 업적창·설정·가이드북. 안에서 스크롤한다 */
      .dialog.tall {
        width: 460px;
        max-height: 78vh;
        display: flex;
        flex-direction: column;
      }
      .dialog.tall .scroll {
        overflow-y: auto;
        margin: 0 -20px;
        padding: 0 20px;
      }
      /* 모달 제목 줄 — 돌아가기와 제목을 한 줄에 둔다 */
      .dialog .title-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 4px;
      }
      .back {
        appearance: none;
        border: 0;
        background: none;
        font: inherit;
        font-size: 12px;
        color: var(--muted);
        padding: 2px 6px 2px 0;
        cursor: pointer;
      }
      .back:hover {
        color: var(--primary);
      }

      /* 모달 안의 탭 — 설정의 일반 / 연결 */
      .subtabs {
        display: flex;
        gap: 4px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 12px;
      }
      .subtabs button {
        appearance: none;
        border: 0;
        background: none;
        color: var(--muted);
        font: inherit;
        font-size: 12px;
        padding: 6px 10px 5px;
        border-bottom: 2px solid transparent;
        cursor: pointer;
      }
      .subtabs button[aria-selected="true"] {
        color: var(--primary);
        border-bottom-color: var(--primary);
        font-weight: 600;
      }

      /* 설정 한 줄 — 왼쪽에 이름과 설명, 오른쪽에 조작 */
      .setting {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 11px 0;
        border-bottom: 1px solid var(--line);
      }
      .setting:last-child {
        border-bottom: 0;
      }
      .setting .body {
        flex: 1;
        min-width: 0;
      }
      .setting .label {
        font-weight: 600;
      }
      .hint {
        color: var(--muted);
        font-size: 11px;
      }
      .setting .hint {
        color: var(--muted);
        font-size: 11px;
      }
      /* 조작이 넓은 줄 — 이름 아래에 조작을 깐다 */
      .setting.stack {
        display: block;
      }
      .setting.stack .chips {
        margin-top: 8px;
        justify-content: flex-start;
      }
      .setting .chips {
        margin: 0;
        justify-content: flex-end;
      }
      /* 켬·끔 — 나란한 두 칸 하나. 막대 모양을 쓰지 않아 다른 칩과 높이가 같다 */
      .toggle {
        display: flex;
        flex: none;
      }
      .toggle button {
        appearance: none;
        font: inherit;
        font-size: 12px;
        padding: 4px 12px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--muted);
        cursor: pointer;
      }
      .toggle button:first-child {
        border-radius: 999px 0 0 999px;
      }
      .toggle button:last-child {
        border-radius: 0 999px 999px 0;
        border-left: 0;
      }
      .toggle button[aria-pressed="true"] {
        background: var(--primary);
        border-color: var(--primary);
        color: var(--inverse);
      }
      /* 설정 안의 다른 화면으로 가는 줄 — 가이드북 */
      .go {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        appearance: none;
        font: inherit;
        text-align: left;
        color: inherit;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: none;
        padding: 11px 0;
        cursor: pointer;
      }
      .go .body {
        flex: 1;
        min-width: 0;
      }
      .go .label {
        font-weight: 600;
      }
      .go .arrow {
        flex: none;
        color: var(--muted);
      }

      /* 업적 한 줄 — 상태는 좌측 dot 로 나눈다 */
      .achievement {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
      }
      .achievement:last-child {
        border-bottom: 0;
      }
      .achievement .state {
        flex: none;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--subtle);
      }
      .achievement.achieved .state {
        background: var(--primary);
      }
      .achievement.claimed .state {
        background: var(--muted);
      }
      .achievement .body {
        flex: 1;
        min-width: 0;
      }
      .achievement .label {
        font-weight: 600;
      }
      .achievement.locked .label {
        color: var(--muted);
        font-weight: 400;
      }
      .achievement .hint {
        color: var(--muted);
        font-size: 11px;
      }
      .achievement .done {
        flex: none;
        font-size: 11px;
        color: var(--muted);
      }

      /* 구매 창 — 수량과 합계 */
      .buy-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 9px 0;
        border-bottom: 1px solid var(--line);
      }
      .buy-row:last-of-type {
        border-bottom: 0;
      }
      .buy-row .value {
        font-weight: 600;
      }
      .qty {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .qty button {
        appearance: none;
        font: inherit;
        width: 26px;
        height: 26px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--surface);
        cursor: pointer;
      }
      .qty button:disabled {
        color: var(--disabled);
        cursor: default;
      }
      .qty .count {
        min-width: 22px;
        text-align: center;
        font-weight: 600;
      }

      /* 개체 고르기 — 박스 개체와 파티 칸을 같은 격자로 본다 */
      .pick-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
        margin-top: 4px;
      }
      .pick-grid .cell {
        aspect-ratio: auto;
        min-height: 78px;
      }
      .pick-grid .cell.on {
        border-color: var(--primary);
        background: var(--accent-bg);
      }

      /* 가이드북 한 꼭지 */
      .topic {
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
      }
      .topic:last-child {
        border-bottom: 0;
      }
      .topic h3 {
        margin: 0 0 4px;
        font-size: 13px;
      }
      .topic p {
        margin: 0 0 4px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header>
      <span class="brand">PokeBuddy</span>
      <span class="spacer"></span>
      <span class="points-label">보유 포인트</span>
      <span class="points" id="points">0 P</span>
      <button type="button" class="icon" id="open-achievements" title="업적창">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M6 3h8v4a4 4 0 0 1-8 0V3Z" />
          <path d="M6 4H4v1a3 3 0 0 0 3 3M14 4h2v1a3 3 0 0 1-3 3" />
          <path d="M10 11v3M7.5 16h5" />
        </svg>
        <span class="dot" id="achievements-dot" hidden></span>
      </button>
      <button type="button" class="icon" id="open-settings" title="설정">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M3 6.5h8.5M15.5 6.5H17M3 13.5h1.5M8.5 13.5H17" />
          <circle cx="13.5" cy="6.5" r="2" />
          <circle cx="6.5" cy="13.5" r="2" />
        </svg>
      </button>
    </header>
    <nav id="tabs"></nav>
    <main id="body"></main>

    <div class="scrim" id="scrim"><div class="dialog" id="dialog"></div></div>

    <script type="module" src="../../dist/renderer/manage.js"></script>
  </body>
</html>
