<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:" />
    <title>pokebuddy</title>
    <style>
      /* 관리 창 — 값은 화면 스냅샷이 준다 (manage.ts). 색은 Figma `PB / Color` 변수와 같다 */
      :root {
        --canvas: #f1f2ee;
        --surface: #ffffff;
        --accent-bg: #ebf4f1;
        --subtle: #dde1db;
        --ink: #1a3330;
        --muted: #4a6663;
        --inverse: #ffffff;
        --disabled: #9ca3af;
        --line: #dde1db;
        --primary: #0f766e;
        --primary-hover: #0a5f56;
        --warning: #f59e0b;
        --danger: #dc2626;
        --scrim: rgba(26, 51, 48, 0.45);
        --radius: 12px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--canvas);
        color: var(--ink);
        font: 13px/1.5 "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* 헤더 — 브랜드와 보유 포인트 */
      header {
        flex: none;
        height: 61px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 24px;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }
      .brand {
        font-size: 15px;
        font-weight: 600;
      }
      .spacer {
        flex: 1;
      }
      .points-label {
        color: var(--muted);
        font-size: 11px;
      }
      .points {
        font-size: 14px;
        font-weight: 600;
      }

      /* 탭 */
      nav {
        flex: none;
        display: flex;
        gap: 4px;
        padding: 0 24px;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }
      nav button {
        appearance: none;
        border: 0;
        background: none;
        color: var(--muted);
        font: inherit;
        padding: 8px 14px 6px;
        border-bottom: 2px solid transparent;
        cursor: pointer;
      }
      nav button[aria-selected="true"] {
        color: var(--primary);
        border-bottom-color: var(--primary);
        font-weight: 600;
      }

      /* 본문 — 여기만 스크롤한다 */
      main {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
      }
      .head {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 14px;
      }
      .head h1 {
        margin: 0;
        font-size: 20px;
      }
      .head .sub {
        color: var(--muted);
        font-size: 12px;
      }

      /* 파티 칸 */
      .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .slot {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 16px;
        min-height: 160px;
        display: flex;
        gap: 14px;
        text-align: left;
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      .slot.blank {
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 6px;
        color: var(--muted);
        background: none;
        border-style: dashed;
      }
      .slot.blank strong {
        color: var(--ink);
        font-size: 13px;
      }
      .slot.blank small {
        font-size: 11px;
      }
      .slot.locked {
        cursor: default;
        color: var(--disabled);
      }
      .portrait {
        position: relative;
        flex: none;
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: var(--accent-bg);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        color: var(--muted);
      }
      /* 숨김 마커 — 닫힌 몬스터볼. 그림 예외라 색을 변수에 묶지 않는다 */
      .mark {
        position: absolute;
        right: -2px;
        top: -2px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 1.5px solid var(--ink);
        background: linear-gradient(to bottom, #e35b4f 0 50%, #ffffff 50% 100%);
        overflow: hidden;
      }
      .mark::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        height: 1.5px;
        margin-top: -0.75px;
        background: var(--ink);
      }
      .mark::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 5px;
        height: 5px;
        margin: -2.5px 0 0 -2.5px;
        border-radius: 50%;
        background: #ffffff;
        border: 1.5px solid var(--ink);
      }
      .info {
        flex: 1;
        min-width: 0;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: var(--muted);
      }
      .name {
        font-size: 15px;
        font-weight: 600;
        margin: 2px 0 6px;
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-bottom: 8px;
      }
      .tag {
        font-size: 10px;
        padding: 2px 7px;
        border-radius: 999px;
        background: var(--subtle);
        color: var(--ink);
      }
      .tag.nature {
        background: none;
        color: var(--muted);
        padding-left: 0;
      }
      .meters {
        display: flex;
        gap: 10px;
      }
      .meter {
        flex: 1;
        min-width: 0;
      }
      .meter .row {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        color: var(--muted);
      }
      .track {
        height: 6px;
        border-radius: 3px;
        background: var(--subtle);
        overflow: hidden;
        margin-top: 3px;
      }
      .fill {
        height: 100%;
        background: var(--primary);
      }
      .fill.hungry {
        background: var(--warning);
      }
      .fill.starving {
        background: var(--danger);
      }

      /* 개체 상세 — 칸을 누르면 뜬다 */
      .scrim {
        position: fixed;
        inset: 0;
        background: var(--scrim);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .scrim.open {
        display: flex;
      }
      .dialog {
        width: 380px;
        max-height: 100%;
        overflow-y: auto;
        background: var(--surface);
        border-radius: var(--radius);
        padding: 20px;
      }
      .dialog h2 {
        margin: 0 0 4px;
        font-size: 17px;
      }
      .dialog .sub {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 14px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 16px;
      }
      button.act {
        appearance: none;
        font: inherit;
        padding: 7px 14px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink);
        cursor: pointer;
      }
      button.act.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: var(--inverse);
      }
      button.act.primary:hover:not(:disabled) {
        background: var(--primary-hover);
      }
      button.act:disabled {
        color: var(--disabled);
        cursor: default;
      }
      /* 알림 — 할 말이 없으면 자리도 차지하지 않는다 */
      .notice {
        margin-top: 14px;
        padding: 10px 12px;
        border-radius: 8px;
        background: var(--accent-bg);
        font-size: 12px;
      }
      .notice:empty {
        display: none;
      }
      .notice.bad {
        background: #fdecec;
        color: var(--danger);
      }
      .empty-note {
        color: var(--muted);
        padding: 40px 0;
        text-align: center;
      }
      /* 곁들이는 한 줄 — 알·박스 칸에서 쓴다 */
      .note {
        color: var(--muted);
      }

      /* 분류 칩 — 도감·상점의 거르개 */
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 14px;
      }
      .chip {
        appearance: none;
        font: inherit;
        font-size: 12px;
        padding: 4px 11px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--muted);
        cursor: pointer;
      }
      .chip[aria-pressed="true"] {
        background: var(--primary);
        border-color: var(--primary);
        color: var(--inverse);
      }

      /* 목록 행 — 상점 상품과 가방 도구 */
      .rows {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      .row-card {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--surface);
        text-align: left;
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      .row-card:disabled {
        color: var(--disabled);
        cursor: default;
      }
      .row-card .body {
        flex: 1;
        min-width: 0;
      }
      .row-card .title {
        font-weight: 600;
        font-size: 13px;
      }
      .row-card .note {
        font-size: 11px;
        color: var(--muted);
      }
      .row-card .price {
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
      }
      .row-card .count {
        font-size: 13px;
        color: var(--muted);
        white-space: nowrap;
      }

      /* 돌보미집 */
      .daycare {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 14px 16px;
        margin-bottom: 16px;
      }
      .daycare .title {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 10px;
      }
      .daycare .title strong {
        font-size: 14px;
      }
      .daycare .title span {
        font-size: 11px;
        color: var(--muted);
      }
      .eggs {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .egg {
        width: 128px;
        padding: 10px;
        border-radius: 10px;
        border: 1px solid var(--line);
        text-align: center;
        font-size: 11px;
      }
      .egg .shell {
        width: 30px;
        height: 38px;
        margin: 0 auto 6px;
        border-radius: 50% 50% 46% 46%;
        background: var(--accent-bg);
        border: 1px solid var(--line);
      }
      .egg .acts {
        display: flex;
        gap: 4px;
        margin-top: 6px;
      }
      .egg .acts button {
        flex: 1;
        appearance: none;
        font: inherit;
        font-size: 10px;
        padding: 3px 0;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: var(--surface);
        cursor: pointer;
      }
      .egg .acts button:disabled {
        color: var(--disabled);
        cursor: default;
      }
      .egg .acts button.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: var(--inverse);
      }

      /* 박스 */
      .pager {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }
      .pager button {
        appearance: none;
        font: inherit;
        padding: 3px 10px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: var(--surface);
        cursor: pointer;
      }
      .pager button:disabled {
        color: var(--disabled);
        cursor: default;
      }
      .pager .label {
        font-weight: 600;
      }
      .pager .used {
        font-size: 11px;
        color: var(--muted);
      }
      .box-grid {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 6px;
      }
      .cell {
        appearance: none;
        font: inherit;
        aspect-ratio: 1 / 1;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--surface);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        font-size: 10px;
        cursor: pointer;
        padding: 2px;
      }
      .cell.blank {
        background: none;
        border-style: dashed;
        cursor: default;
      }
      .cell .dot {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--accent-bg);
      }
      .cell .who {
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* 도감 */
      .dex-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
      }
      .dex-cell {
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--surface);
        padding: 10px 6px;
        text-align: center;
        font-size: 11px;
      }
      .dex-cell.locked {
        background: var(--subtle);
        color: var(--muted);
      }
      .dex-cell .no {
        font-size: 10px;
        color: var(--muted);
      }
      .dex-cell .dot {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--accent-bg);
        margin: 4px auto;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="brand">PokeBuddy</span>
      <span class="spacer"></span>
      <span class="points-label">보유 포인트</span>
      <span class="points" id="points">0 P</span>
    </header>
    <nav id="tabs"></nav>
    <main id="body"></main>

    <div class="scrim" id="scrim">
      <div class="dialog">
        <h2 id="d-name">이름</h2>
        <div class="sub" id="d-sub">상태</div>
        <div class="meters" id="d-meters"></div>
        <div class="actions" id="d-actions"></div>
        <div class="notice" id="d-notice"></div>
      </div>
    </div>

    <script type="module" src="../../dist/renderer/manage.js"></script>
  </body>
</html>
