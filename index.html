<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>terminal_pkmon</title>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
      }
      body {
        -webkit-app-region: drag; /* 창 아무 데나 잡아 이동 */
        cursor: grab;
      }
      canvas,
      img {
        display: block;
        image-rendering: pixelated; /* 도트 뭉개짐 방지 */
      }
      canvas {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="pkmon"></canvas>
    <script>
      const CELL = { w: 192, h: 208 };
      // Codex 스프라이트시트의 동작 순서 (세로 9칸)
      const ROWS = [
        "idle",
        "running-right",
        "running-left",
        "waving",
        "jumping",
        "failed",
        "waiting",
        "running",
        "review",
      ];
      // 실제로 쓰는 동작 — 좌우 이동·점프는 Codex 앱이 화면을 돌아다닐 때 쓰는 줄이라 여기선 안 쓴다
      const USED_ROWS = ["idle", "waving", "failed", "waiting", "running", "review"];
      const params = new URLSearchParams(location.search);
      const fps = Number(params.get("fps") || 7);
      const debug = Boolean(params.get("debug"));
      // auto = 스프라이트가 그 상태를 표현하지 못할 때만 보정 · on = 항상 · off = 안 함
      const motionAssist = params.get("motionAssist") || "off";
      const DRAW_MS = 33; // 보정 움직임을 부드럽게 하려고 그리기만 30fps
      // 펫마다 원본 해상도가 달라 도트 굵기가 2배까지 차이 난다 — 이 값(px)에 맞춰 크기를 조정한다. 0 이면 보정 없음
      const dotTarget = Number(params.get("dotSize") ?? 2);
      // 마지막 → 첫 프레임이 튀는 스프라이트는 왕복으로 재생한다 (3D 는 올리는 동작만 담겨 있다)
      const pingPong = params.get("pingPong") || "auto";
      const LOOP_BREAK_RATIO = 2.5; // 연속 변화 평균의 이 배를 넘으면 루프가 끊긴 것으로 본다
      const BASELINE_MARGIN = 6; // 바닥선 여백 — 크기가 달라도 서 있는 선을 맞춘다

      const canvas = document.getElementById("pkmon");
      canvas.width = CELL.w;
      canvas.height = CELL.h;
      const ctx = canvas.getContext("2d");
      ctx.imageSmoothingEnabled = false;

      let sheet = null;
      let frames = {}; // 동작 → 내용이 있는 프레임 번호 목록
      const sequences = {}; // 동작 → 실제 재생 순서 (왕복이면 되돌아오는 프레임까지 포함)
      const fingerprints = {}; // 동작 → 프레임 지문 (동작끼리 같은 그림인지 비교용)
      let state = "idle";
      let tick = 0;
      let stateStartedAt = 0;
      let draws = 0;
      let transform = { scale: 1, dx: 0, dy: 0, dot: null };

      function scanFrames() {
        // 빈 칸을 걸러내고, 동작끼리 같은 그림인지 비교할 지문도 함께 만든다
        const probe = document.createElement("canvas");
        probe.width = CELL.w;
        probe.height = CELL.h;
        const pctx = probe.getContext("2d", { willReadFrequently: true });
        ROWS.forEach((row, r) => {
          const cols = [];
          const marks = [];
          for (let c = 0; c < 8; c++) {
            pctx.clearRect(0, 0, CELL.w, CELL.h);
            pctx.drawImage(sheet, c * CELL.w, r * CELL.h, CELL.w, CELL.h, 0, 0, CELL.w, CELL.h);
            const data = pctx.getImageData(0, 0, CELL.w, CELL.h).data;
            let mark = 0;
            let visible = false;
            for (let i = 0; i < data.length; i += 4) {
              if (data[i + 3] > 127) {
                visible = true;
                mark = (mark * 31 + data[i] + data[i + 1] * 3 + data[i + 2] * 7 + i) % 1000000007;
              }
            }
            if (visible) {
              cols.push(c);
              marks.push(mark);
            }
          }
          if (cols.length) {
            frames[row] = cols;
            fingerprints[row] = marks;
          }
        });
      }

      // 두 프레임의 차이 — 루프가 이어지는지 재는 데 쓴다
      function frameDelta(pctx, row, a, b) {
        const grab = (c) => {
          pctx.clearRect(0, 0, CELL.w, CELL.h);
          pctx.drawImage(sheet, c * CELL.w, row * CELL.h, CELL.w, CELL.h, 0, 0, CELL.w, CELL.h);
          return pctx.getImageData(0, 0, CELL.w, CELL.h).data;
        };
        const da = grab(a);
        const db = grab(b);
        let sum = 0;
        for (let i = 0; i < da.length; i += 16) {
          sum += Math.max(Math.abs(da[i] - db[i]), Math.abs(da[i + 1] - db[i + 1]), Math.abs(da[i + 2] - db[i + 2]));
        }
        return sum;
      }

      // 동작별 재생 순서 — 마지막에서 처음으로 튀는 스프라이트는 왕복(올렸다 내리기)으로 돌린다
      function buildSequences() {
        const probe = document.createElement("canvas");
        probe.width = CELL.w;
        probe.height = CELL.h;
        const pctx = probe.getContext("2d", { willReadFrequently: true });

        ROWS.forEach((row, r) => {
          const cols = frames[row];
          if (!cols || cols.length < 3) {
            if (cols) sequences[row] = cols.slice();
            return;
          }
          let bounce = pingPong === "on";
          // 수치 판정은 실제로 쓰는 동작에서만 — 픽셀을 읽는 비용이 커서 전 동작에 돌리면 창이 늦게 뜬다
          if (pingPong === "auto" && !USED_ROWS.includes(row)) {
            sequences[row] = cols.slice();
            return;
          }
          if (pingPong === "auto") {
            let consec = 0;
            for (let i = 0; i < cols.length - 1; i++) {
              consec += frameDelta(pctx, r, cols[i], cols[i + 1]);
            }
            const avg = consec / (cols.length - 1);
            const wrap = frameDelta(pctx, r, cols[cols.length - 1], cols[0]);
            bounce = avg > 0 && wrap / avg > LOOP_BREAK_RATIO;
          }
          // 왕복: 0,1,2,3,4,5,4,3,2,1 — 양 끝은 한 번씩만
          sequences[row] = bounce ? cols.concat(cols.slice(1, -1).reverse()) : cols.slice();
        });
      }

      // 대기 첫 프레임에서 같은 색이 가로로 이어지는 길이의 최빈값 = 겉보기 도트 한 칸
      function measureDotSize() {
        const cols = frames.idle;
        if (!cols || !cols.length) return null;
        const probe = document.createElement("canvas");
        probe.width = CELL.w;
        probe.height = CELL.h;
        const pctx = probe.getContext("2d", { willReadFrequently: true });
        pctx.drawImage(sheet, cols[0] * CELL.w, 0, CELL.w, CELL.h, 0, 0, CELL.w, CELL.h);
        const data = pctx.getImageData(0, 0, CELL.w, CELL.h).data;
        const runs = new Map();
        let minX = CELL.w;
        let maxX = -1;
        let minY = CELL.h;
        let maxY = -1;
        for (let y = 0; y < CELL.h; y++) {
          let run = 0;
          let prev = null;
          for (let x = 0; x < CELL.w; x++) {
            const i = (y * CELL.w + x) * 4;
            const solid = data[i + 3] > 127;
            const cur = solid ? `${data[i]},${data[i + 1]},${data[i + 2]}` : null;
            if (solid) {
              if (x < minX) minX = x;
              if (x > maxX) maxX = x;
              if (y < minY) minY = y;
              if (y > maxY) maxY = y;
            }
            if (cur !== null && cur === prev) {
              run += 1;
            } else {
              if (prev !== null && run) runs.set(run, (runs.get(run) || 0) + 1);
              run = solid ? 1 : 0;
            }
            prev = cur;
          }
          if (prev !== null && run) runs.set(run, (runs.get(run) || 0) + 1);
        }
        let dot = 1;
        let best = 0;
        for (const [len, count] of runs) {
          if (len <= 8 && count > best) {
            best = count;
            dot = len;
          }
        }
        return { dot, bbox: { x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1 } };
      }

      // 도트 굵기를 목표치에 맞추고, 크기가 달라져도 서 있는 선은 같게 맞춘다
      function computeTransform() {
        const measured = measureDotSize();
        if (!dotTarget || !measured || !measured.bbox.w) return { scale: 1, dx: 0, dy: 0, dot: null };
        const { dot, bbox } = measured;
        // 0.25 단위로 반올림 — 도트가 고르게 보이도록
        let scale = Math.round((dotTarget / dot) * 4) / 4 || 1;
        scale = Math.min(scale, CELL.w / bbox.w, CELL.h / bbox.h);
        const dx = CELL.w / 2 - (bbox.x + bbox.w / 2) * scale;
        const dy = CELL.h - BASELINE_MARGIN - (bbox.y + bbox.h) * scale;
        return { scale, dx, dy, dot };
      }

      // 이 동작이 대기와 같은 그림인지 — 3D 스프라이트는 기다림·작업 중·검토가 모두 대기와 같다
      function sameAsIdle(row) {
        const marks = fingerprints[row];
        const idle = fingerprints.idle;
        if (!marks || !idle) return false;
        return marks.every((m) => idle.includes(m));
      }

      // 두 동작이 같은 그림을 쓰는지 — 장수는 달라도 된다
      function sameFrames(a, b) {
        const fa = fingerprints[a];
        const fb = fingerprints[b];
        if (!fa || !fb || !fa.length || !fb.length) return false;
        const shorter = fa.length <= fb.length ? fa : fb;
        const longer = fa.length <= fb.length ? fb : fa;
        return shorter.every((m) => longer.includes(m));
      }

      // 스프라이트가 그 상태를 표현하지 못할 때 펫 쪽에서 움직임을 더한다
      function assistOffset(now) {
        if (motionAssist === "off") return { dx: 0, dy: 0 };
        // auto 는 "그 상태를 스프라이트가 표현하지 못할 때"만 — 대기는 비교 대상이 자기 자신이라 제외
        if (motionAssist !== "on" && (state === "idle" || !sameAsIdle(state))) return { dx: 0, dy: 0 };

        // 위아래로만 움직인다 — 좌우로 흔들면 스프라이트 자체의 움직임과 부딪혀 어색해진다
        const t = now / 1000;
        switch (state) {
          case "running":
            return { dx: 0, dy: -Math.abs(Math.sin(t * 5)) * 4 };
          case "failed":
            return { dx: 0, dy: Math.sin(t * 6) * 2 };
          case "waving":
            return { dx: 0, dy: -Math.abs(Math.sin(t * 4)) * 3 };
          case "waiting":
            return { dx: 0, dy: Math.sin(t * 1.6) * 2 };
          default:
            return { dx: 0, dy: Math.sin(t * 2.4) * 2 };
        }
      }

      function draw() {
        draws += 1;
        const row = sequences[state] ? state : "idle";
        const cols = sequences[row];
        if (!cols || !cols.length) return;
        const c = cols[tick % cols.length];
        const r = ROWS.indexOf(row);
        const assist = assistOffset(performance.now());
        ctx.clearRect(0, 0, CELL.w, CELL.h);
        ctx.drawImage(
          sheet,
          c * CELL.w,
          r * CELL.h,
          CELL.w,
          CELL.h,
          Math.round(transform.dx + assist.dx),
          Math.round(transform.dy + assist.dy),
          CELL.w * transform.scale,
          CELL.h * transform.scale,
        );
      }

      // 원본 GIF — 프레임 수·간격이 원본 그대로라 계산할 게 없다. 브라우저가 알아서 돌린다
      function setupGif(art) {
        canvas.style.display = "none";
        const img = document.createElement("img");
        img.src = art.dataUrl;
        img.style.width = `${art.w * art.scale}px`;
        img.style.height = `${art.h * art.scale}px`;
        document.body.appendChild(img);
        if (debug) {
          console.log(JSON.stringify({ 그림: "gif", 원본: `${art.w}x${art.h}`, 배율: art.scale }));
          setInterval(() => console.log(JSON.stringify({ kind: "gif", state, visibility: document.visibilityState })), 2000);
        }
      }

      // 팩의 스프라이트시트 — 8칸 격자에서 프레임을 골라 직접 돌린다
      function setupSheet(art) {
        const img = new Image();
        img.onload = () => {
          sheet = img;
          scanFrames();
          buildSequences();
          transform = computeTransform();
          stateStartedAt = performance.now();
          draw();

          // 스프라이트 프레임은 fps 대로 넘기고, 그리기는 30fps — 보정 움직임을 부드럽게
          const frameMs = Math.round(1000 / fps);
          const startedAt = performance.now();
          let lastFrame = -1;
          setInterval(() => {
            const nextFrame = Math.floor((performance.now() - startedAt) / frameMs);
            if (nextFrame !== lastFrame) {
              lastFrame = nextFrame;
              tick += 1;
            }
            draw();
          }, DRAW_MS);

          if (debug) {
            console.log(
              JSON.stringify({
                그림: "sheet",
                도트: transform.dot,
                배율: transform.scale,
                pingPong,
                재생순서: Object.fromEntries(
                  Object.keys(sequences).map((row) => [row, `${frames[row].length}장→${sequences[row].length}스텝`]),
                ),
              }),
            );
            setInterval(
              () =>
                console.log(
                  JSON.stringify({ tick, draws, state, visibility: document.visibilityState })),
              2000,
            );
          }
        };
        img.src = art.dataUrl;
      }

      window.pkmon.getArt().then((art) => (art.kind === "gif" ? setupGif(art) : setupSheet(art)));

      window.pkmon.onState((next) => {
        if (next !== state) {
          // 그림이 같으면 프레임을 이어서 재생 — 되감으면 날갯짓이 중간에 끊겨 보인다
          if (!sameFrames(next, state)) tick = 0;
          state = next;
          stateStartedAt = performance.now();
        }
      });
      window.pkmon.onClickThrough((on) => {
        document.body.style.webkitAppRegion = on ? "no-drag" : "drag";
        document.body.style.cursor = on ? "default" : "grab";
      });
    </script>
  </body>
</html>
